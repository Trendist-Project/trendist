# 운영. 값은 서버 docker compose의 env_file(../.env)과 environment로 받는다.
server:
  # nginx upstream trendist-back:4001
  port: ${PROD_SERVER_PORT}
  # nginx가 넣는 X-Forwarded-For로 실제 접속 IP를 읽는다(자랑하기 카드 조회 수의 방문자 구분, 4.24)
  forward-headers-strategy: native
  # docker stop(SIGTERM)을 받으면 새 요청은 막고 진행 중인 요청을 끝낸 뒤 종료한다. 이 사이에 메모리의 보관함·카운터를 DB에 마지막으로 저장한다(@PreDestroy)
  shutdown: graceful

spring:
  lifecycle:
    # 종료 단계마다 기다리는 최대 시간. 서버 compose의 stop_grace_period(docker stop 대기)보다 짧게 둔다
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${PROD_MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  # JPA 설정
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # 엔티티 2차 캐시 켬(키워드·상태·레벨 등 읽기 위주 데이터를 메모리에서 읽는다, application.yml)
        cache:
          use_second_level_cache: true
    show-sql: false    # Hibernate 가 생성하는 SQL 쿼리를 콘솔에 출력
    hibernate:
      ddl-auto: none # 스키마는 Flyway만 바꾼다. 운영 DB가 엔티티와 같다고 확인되면 validate로 올린다(16.1)

  flyway:
    enabled: true

trendist:
  # 보관함·키워드 카운터는 서버 메모리가 원천이고 DB에는 바뀐 것만 1분마다, 정상 종료(docker stop)할 때 마지막으로 저장한다(docs/plans/memory-holdings.md).
  # 서버 1대 기준이며, 강제 종료(kill -9·전원)하면 마지막 1분 치 변화가 사라진다. 끄려면 두 값을 false로
  memory-holdings: true
  memory-counters: true
  # 킬·빼앗기 기록은 메모리에 모았다가 1분마다 플레이어당 한 트랜잭션으로 반영한다(player/memory). 강제 종료하면 마지막 1분 치가 사라진다. 끄려면 false
  memory-player-counters: true
  cookie:
    secure: true
  # 키워드 AI 한 줄 설명용 제미나이 API 키(운영, 4.12)
  gemini:
    api-key: ${PROD_GEMINI_API_KEY:}
  # 게임 WebSocket을 열 수 있는 사이트 주소(쉼표로 여러 개). 기본값은 운영 도메인
  ws:
    allowed-origins: ${PROD_ALLOWED_ORIGINS:https://trendist.kr,https://www.trendist.kr}
  # 공유 주소·OG 태그에 쓰는 운영 사이트 주소(4.24)
  share:
    base-url: ${PROD_SITE_URL:https://trendist.kr}
  dev-trends:
    enabled: false
