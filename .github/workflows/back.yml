name: Trendist Back Deploy

on:
  push:
    branches: [ "main" ]
    # 모노레포: back/ 또는 이 워크플로가 바뀔 때만 배포한다
    paths:
      - "back/**"
      - ".github/workflows/back.yml"

jobs:
  # 빌드·이미지 push·배포를 job 하나로 돈다(job마다 과금 분이 올림되므로)
  build:
    name: 🔧빌드·🚀배포
    runs-on: ubuntu-latest
    # 체크아웃한 저장소의 back/에서 gradlew·docker compose를 실행한다
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 테스트(H2 메모리 DB)까지 돌린 뒤 실행용 jar를 만든다
      - name: Build with Gradle
        run: ./gradlew build

      # DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: dlrudgjs104
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and Push Docker image
        run: |
          cd .github/docker
          docker compose -f compose.build.yml build
          docker compose -f compose.build.yml push

      # ENV_FILE 시크릿이 비어 있으면 서버의 .env를 빈 파일로 덮어쓰게 되므로 배포를 멈춘다
      # .env는 back/이 아닌 작업 공간 루트에 만든다(scp source ".env"가 루트 기준이라 서버에 back/.env로 가지 않게)
      - name: Write .env file to temporary file
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "ENV_FILE 시크릿이 비어 있습니다"; exit 1
          fi
          echo "${{ secrets.ENV_FILE }}" > .env

      # 서버 docker compose의 env_file(../.env) 위치로 보낸다
      - name: Send .env to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 220.71.172.204
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".env"
          target: "/home/ubuntu/trendist"

      # 단일 컨테이너 중단 배포: 새 이미지를 받고, 기존 컨테이너를 내린 뒤 새로 띄운다.
      # 실행 설정(포트, 네트워크, 볼륨)은 서버의 docker compose 파일을 그대로 쓴다.
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 220.71.172.204
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/trendist/trendist-back
            # 서버에 compose v2 플러그인이 없으면 docker-compose(v1)를 쓴다
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            $DC pull trendist-back
            $DC stop trendist-back
            $DC rm -f trendist-back
            $DC up -d trendist-back
            # nginx upstream(trendist-back:4001)이 새 컨테이너 주소를 다시 읽게 한다
            docker exec nginx nginx -s reload
            docker image prune -f
